services:

  postgres:
    image: pgvector/pgvector:pg16
    container_name: adaptive_tutor_postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: adaptive_tutor
      POSTGRES_USER: tutor
      POSTGRES_PASSWORD: tutor_password

    ports:
      - "5434:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tutor -d adaptive_tutor"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://tutor:tutor_password@postgres:5432/adaptive_tutor
      # Ollama runs on the host, not in a container.
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      # Set SECRET_KEY in a root .env file (see .env.example).
      SECRET_KEY: ${SECRET_KEY:-}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  postgres_data:
