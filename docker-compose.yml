services:

  postgres:
    image: pgvector/pgvector:pg16
    container_name: adaptive_tutor_postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: adaptive_tutor
      POSTGRES_USER: tutor
      POSTGRES_PASSWORD: tutor_password

    ports:
      - "5434:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: