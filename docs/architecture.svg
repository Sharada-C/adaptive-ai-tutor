<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 600" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Adaptive AI Tutor architecture</title>
<desc id="d">React frontend calls a FastAPI backend whose services use PostgreSQL with pgvector, Ollama models and the Wikipedia API.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#667085"/></marker></defs>
<rect width="980" height="600" fill="#ffffff"/>
<text x="20" y="30" font-size="18" font-weight="700" fill="#172033">Adaptive AI Tutor: architecture</text>
<rect x="20" y="70" width="190" height="150" rx="8" fill="#eef4ff" stroke="#7aa2e3" stroke-width="1.5"/><text x="32" y="92" font-weight="700" font-size="14" fill="#172033">React + Vite frontend</text><text x="32" y="112" font-size="12" fill="#475467">Lesson, quiz, reteach,</text><text x="32" y="129" font-size="12" fill="#475467">progress, My learning</text><text x="32" y="146" font-size="12" fill="#475467"></text><text x="32" y="163" font-size="12" fill="#475467">Calls /api (dev proxy</text><text x="32" y="180" font-size="12" fill="#475467"> strips the prefix)</text>
<rect x="250" y="50" width="360" height="530" rx="12" fill="#f8fafc" stroke="#98a2b3" stroke-width="1.5"/>
<text x="266" y="74" font-weight="700" font-size="15" fill="#172033">FastAPI backend</text>
<rect x="266" y="88" width="328" height="52" rx="8" fill="#ffffff" stroke="#b8c0cc" stroke-width="1.5"/><text x="278" y="110" font-weight="700" font-size="14" fill="#172033">Auth and roles</text><text x="278" y="130" font-size="12" fill="#475467">Signed tokens; student, instructor, admin</text>
<rect x="266" y="150" width="328" height="52" rx="8" fill="#ffffff" stroke="#b8c0cc" stroke-width="1.5"/><text x="278" y="172" font-weight="700" font-size="14" fill="#172033">Planner / adaptive engine</text><text x="278" y="192" font-size="12" fill="#475467">Teach, reteach, practise or advance</text>
<rect x="266" y="212" width="328" height="52" rx="8" fill="#ffffff" stroke="#b8c0cc" stroke-width="1.5"/><text x="278" y="234" font-weight="700" font-size="14" fill="#172033">Mastery tracking</text><text x="278" y="254" font-size="12" fill="#475467">Recency-weighted last 5 + prior; advance at 0.80</text>
<rect x="266" y="274" width="328" height="52" rx="8" fill="#ffffff" stroke="#b8c0cc" stroke-width="1.5"/><text x="278" y="296" font-weight="700" font-size="14" fill="#172033">Retrieval (RAG)</text><text x="278" y="316" font-size="12" fill="#475467">500-word chunks, top-3, similarity >= 0.50</text>
<rect x="266" y="336" width="328" height="62" rx="8" fill="#ffffff" stroke="#b8c0cc" stroke-width="1.5"/><text x="278" y="358" font-weight="700" font-size="14" fill="#172033">Tutor and quiz generation</text><text x="278" y="378" font-size="12" fill="#475467">Answers must be grounded in evidence;</text><text x="278" y="395" font-size="12" fill="#475467">extractive fallback if not</text>
<rect x="266" y="408" width="328" height="62" rx="8" fill="#ffffff" stroke="#b8c0cc" stroke-width="1.5"/><text x="278" y="430" font-weight="700" font-size="14" fill="#172033">Answer grader</text><text x="278" y="450" font-size="12" fill="#475467">Claims, evidence, second-opinion verifier,</text><text x="278" y="467" font-size="12" fill="#475467">coverage check</text>
<rect x="266" y="480" width="328" height="62" rx="8" fill="#ffffff" stroke="#b8c0cc" stroke-width="1.5"/><text x="278" y="502" font-weight="700" font-size="14" fill="#172033">Courses and material</text><text x="278" y="522" font-size="12" fill="#475467">Private/shared courses, PDF/TXT uploads</text><text x="278" y="539" font-size="12" fill="#475467">Per-concept Wikipedia articles</text>
<rect x="690" y="70" width="270" height="150" rx="8" fill="#ecfdf3" stroke="#6ec49a" stroke-width="1.5"/><text x="702" y="92" font-weight="700" font-size="14" fill="#172033">PostgreSQL + pgvector</text><text x="702" y="112" font-size="12" fill="#475467">Users, courses, concepts</text><text x="702" y="129" font-size="12" fill="#475467">Attempts, mastery, misconceptions</text><text x="702" y="146" font-size="12" fill="#475467">Knowledge chunks (768-d vectors)</text><text x="702" y="163" font-size="12" fill="#475467">Alembic migrations</text>
<rect x="690" y="270" width="270" height="150" rx="8" fill="#fff6e5" stroke="#e0a84a" stroke-width="1.5"/><text x="702" y="292" font-weight="700" font-size="14" fill="#172033">Ollama (local)</text><text x="702" y="312" font-size="12" fill="#475467">Tutor and quiz: llama3.2:3b</text><text x="702" y="329" font-size="12" fill="#475467">Grader: qwen2.5:7b (recommended)</text><text x="702" y="346" font-size="12" fill="#475467">Embeddings: nomic-embed-text</text>
<rect x="690" y="470" width="270" height="90" rx="8" fill="#f4f0ff" stroke="#a58ae0" stroke-width="1.5"/><text x="702" y="492" font-weight="700" font-size="14" fill="#172033">Wikipedia API</text><text x="702" y="512" font-size="12" fill="#475467">Topic and per-concept articles</text><text x="702" y="529" font-size="12" fill="#475467">CC BY-SA, cited as chunk source</text>
<line x1="210" y1="145" x2="250" y2="145" stroke="#667085" stroke-width="1.5" marker-end="url(#a)" marker-start="url(#a)"/>
<line x1="594" y1="238" x2="690" y2="150" stroke="#667085" stroke-width="1.5" marker-end="url(#a)" marker-start="url(#a)"/>
<line x1="594" y1="300" x2="690" y2="195" stroke="#667085" stroke-width="1.5" marker-end="url(#a)" marker-start="url(#a)"/>
<line x1="594" y1="367" x2="690" y2="320" stroke="#667085" stroke-width="1.5" marker-end="url(#a)" marker-start="url(#a)"/>
<line x1="594" y1="439" x2="690" y2="375" stroke="#667085" stroke-width="1.5" marker-end="url(#a)" marker-start="url(#a)"/>
<line x1="594" y1="511" x2="690" y2="515" stroke="#667085" stroke-width="1.5" marker-end="url(#a)" marker-start="url(#a)"/>
<text x="20" y="590" font-size="11" fill="#667085">Retrieval also calls the embedding model. Language-model calls retry once and time out after OLLAMA_TIMEOUT_SECONDS.</text>
</svg>